# ============================================
# Netlify Configuration - Ali App
# ============================================

[build]
  publish = "public"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

# إعادة توجيه جميع الطلبات إلى index.html
# (ما عدا الملفات الثابتة والدوال)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# رؤوس الأمان
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
