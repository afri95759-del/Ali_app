<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ali App - متجر التطبيقات</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
</head>
<body>

  <header class="main-header">
    <div class="container header-content">
      <div class="logo">
        <span class="logo-icon">📱</span>
        <h1>Ali<span>App</span></h1>
      </div>
      
      <div class="header-actions">
        <button id="loginBtn" class="btn btn-outline">
          <span>👤</span> تسجيل الدخول
        </button>
        
        <a href="admin.html" id="adminIcon" class="admin-icon hidden" title="لوحة التحكم">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 2L3 7v5c0 5.5 3.8 10.7 9 12 5.2-1.3 9-6.5 9-12V7l-9-5z"/>
            <path d="M9 12l2 2 4-4"/>
          </svg>
        </a>
      </div>
    </div>
  </header>

  <section class="hero">
    <div class="container">
      <h2>اكتشف أفضل التطبيقات</h2>
      <p>حمّل تطبيقات حصرية وقيّمها وشارك تجربتك</p>
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="ابحث عن تطبيق...">
        <button class="search-btn">🔍</button>
      </div>
    </div>
  </section>

  <main class="container">
    <div id="appsGrid" class="apps-grid">
      <div class="loading">⏳ جاري تحميل التطبيقات...</div>
    </div>
  </main>

  <div id="authModal" class="modal hidden">
    <div class="modal-content">
      <button class="close-btn" id="closeAuth">×</button>
      <h3 id="authTitle">تسجيل الدخول</h3>
      
      <form id="authForm">
        <input type="email" id="email" placeholder="البريد الإلكتروني" required>
        <input type="password" id="password" placeholder="كلمة المرور" required>
        <button type="submit" class="btn btn-primary" id="authSubmit">دخول</button>
      </form>
      
      <p class="auth-switch">
        <span id="switchText">ليس لديك حساب؟</span>
        <a href="#" id="switchAuth">أنشئ حساباً</a>
      </p>
      
      <button id="googleLogin" class="btn btn-google">
        <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="18">
        الدخول بحساب Google
      </button>
    </div>
  </div>

  <div id="appModal" class="modal hidden">
    <div class="modal-content app-detail">
      <button class="close-btn" id="closeApp">×</button>
      <div id="appDetailContent"></div>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
                 </html>
